#Sun Feb 13 12:22:01 CET 2022
android.useAndroidX=true
android.enableJetifier=true
# Unterdrückt Warnung bei JDK 21: „source/target 8 ist veraltet“
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# Gradle 8.7+ für AGP 8.5.x, Java 17+
org.gradle.java.home=C:/Users/ThinkStation P920/.jdks/temurin-17.0.17

# 16-KB-Seitengröße (ab Nov 2025 für Play Store): Native Libs nicht komprimieren, damit Alignment funktioniert
android.bundle.enableNativeLibraryCompression=false

# Erlaubt Builds auch dann, wenn der Projektpfad auf Windows Nicht-ASCII-Zeichen enthält.
android.overridePathCheck=true
