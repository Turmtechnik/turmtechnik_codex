# AndroidX verwenden (erforderlich für androidx.appcompat usw.)
android.useAndroidX=true

# Pfad enthält nicht-ASCII-Zeichen (z. B. "ü" in "überarbeiten");
# diese Prüfung deaktivieren, damit der Build unter Windows trotzdem läuft.
# Siehe https://issuetracker.google.com/issues/109894332
android.overridePathCheck=true
