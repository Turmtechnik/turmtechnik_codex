//apply plugin: 'com.android.application'



buildscript {
    repositories {
        mavenCentral()
        // jcenter() ist deprecated, entfernt
        maven {
            //url 'https://maven.google.com/'
            //name 'Google'
            url "https://repo.spring.io/release"
        }
        maven {
            url "https://repository.jboss.org/maven2"
        }
        google()
    }
    dependencies {
        //classpath 'com.android.tools.build:gradle:3.1.0'
        // AGP 8.5.2 für 16-KB-Native-Library-Alignment (Play-Store-Pflicht ab Nov 2025), Gradle 8.7+
        classpath 'com.android.tools.build:gradle:8.5.2'


    }

}

apply plugin: 'com.android.application'

ext {
    var = 'key0'
}


dependencies {
//    compile fileTree(dir: 'libs', include: '*.jar')
//    compile 'com.google.android.gms:play-services:9.6.0'
    // Alle JARs aus libs einbinden, außer gson-2.2.4.jar (verwenden stattdessen gson:2.10.1)
    // Die alte gson-2.2.4.jar wird manuell ausgeschlossen, da exclude in fileTree nicht zuverlässig funktioniert
    implementation files(
        'libs/google-api-client-1.15.0-rc.jar',
        'libs/google-api-client-android-1.15.0-rc.jar',
        'libs/google-api-services-datastore-v1beta1-rev6-1.15.0-rc.jar',
        'libs/google-api-services-drive-v2-rev97-1.15.0-rc.jar',
        'libs/google-api-services-storage-v1beta2-rev23-1.15.0-rc.jar',
        'libs/google-http-client-1.15.0-rc.jar',
        'libs/google-http-client-android-1.15.0-rc.jar',
        'libs/google-http-client-gson-1.15.0-rc.jar',
        'libs/google-http-client-jackson-1.15.0-rc.jar',
        'libs/google-http-client-jackson2-1.15.0-rc.jar',
        'libs/google-oauth-client-1.15.0-rc.jar',
        // 'libs/gson-2.2.4.jar' - AUSGESCHLOSSEN, verwenden stattdessen gson:2.10.1
        'libs/gss_lib_2.2.b1.jar',
        'libs/jackson-core-2.1.3.jar',
        'libs/jackson-core-asl-1.9.11.jar',
        'libs/java-websocket-1.3.0.jar',
        'libs/jsr305-1.3.9.jar',
        'libs/jxl.jar'
    )
    implementation 'com.google.android.gms:play-services:9.6.0'
    // Apache HttpClient (org.apache.http.conn.ssl) – für Google API Client / SSLSocketFactoryExtension
    implementation 'org.apache.httpcomponents:httpclient-android:4.3.5.1'

}


android
        {
            namespace 'tom.turmtechnik'

            lint {
                checkReleaseBuilds false
            }

            compileSdkVersion 34
            useLibrary 'org.apache.http.legacy'

            defaultConfig {

                minSdkVersion 21
                targetSdkVersion 34

                // Enabling multidex support.
                multiDexEnabled true
                
                // Automatische Versionserhöhung basierend auf Build-Timestamp
                // versionCode wird automatisch bei jedem Build erhöht (Sekunden seit 2020-01-01)
                def buildTime = (int) ((System.currentTimeMillis() / 1000) - 1577836800) // 2020-01-01 00:00:00 UTC
                versionCode buildTime
                // Version inkl. Datum und Uhrzeit (ST:min) für bessere Nachverfolgbarkeit
                def buildDate = new Date().format('dd.MM.yy HH:mm')
                versionName "40.0 " + buildDate
            }





            sourceSets {
                main {
                    manifest.srcFile 'AndroidManifest.xml'
                    java.srcDirs = ['src']
                    resources.srcDirs = ['src']
                    aidl.srcDirs = ['src']
                    renderscript.srcDirs = ['src']
                    res.srcDirs = ['res']
                    assets.srcDirs = ['assets']
                }

                // Move the tests to tests/java, tests/res, etc...
                //instrumentTest.setRoot('tests')

                // Move the build types to build-types/<type>
                // For instance, build-types/debug/java, build-types/debug/AndroidManifest.xml, ...
                // This moves them out of them default location under src/<type>/... which would
                // conflict with src/ being used by the main source set.
                // Adding new build types or product flavors should be accompanied
                // by a similar customization.
                debug.setRoot('build-types/debug')
                release.setRoot('build-types/release')
            }

            dependencies {
                //compile 'com.android.support:multidex:1.0.0'
                //implementation 'com.android.support:multidex:1.0.0'
                implementation 'androidx.appcompat:appcompat:1.0.2'
                // materail io
                implementation 'com.google.android.material:material:1.0.0'
                //implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
                // NanoHTTPD für Web-Server - ENTFERNT, da keine Version verfügbar ist
                // Stattdessen verwenden wir eine einfache HTTP-Server-Implementierung mit Java ServerSocket
                // Keine externe Dependency nötig
                // Gson für JSON-Serialisierung
                implementation 'com.google.code.gson:gson:2.10.1'
                // CameraX 1.4.0+ für Bewegungserkennung (Frontkamera) und 16-KB-Seitengröße (Play Store ab Nov 2025)
                implementation 'androidx.camera:camera-core:1.4.0'
                implementation 'androidx.camera:camera-camera2:1.4.0'
                implementation 'androidx.camera:camera-lifecycle:1.4.0'
                implementation 'androidx.lifecycle:lifecycle-service:2.6.2'
            }
            
            packagingOptions {
                pickFirst '**/libc++_shared.so'
                pickFirst '**/libjsc.so'
            }


           // dexOptions {
           //     javaMaxHeapSize "4g"
           // }
        }

repositories {
    google()
    mavenCentral()
}